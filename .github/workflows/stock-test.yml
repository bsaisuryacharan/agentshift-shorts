name: stock-test
# Fetches a few Pixabay/Pexels clips with the real keys, runs the same checks as the pipeline and uploads a contact sheet. No LLM calls except the cheap vision check; no image quota.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - run: python -m app.stocktest out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocktest
          path: out/
