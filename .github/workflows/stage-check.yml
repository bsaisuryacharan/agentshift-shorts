name: stage-check
# Tests one pipeline step on several topics (pick | script | pictures). Nothing is recorded or sent to Telegram; the report is an artifact.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "pick | script | pictures | research"
        required: true
        default: pick
      n:
        description: "how many different topics"
        required: true
        default: "4"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - run: python -m app.stagecheck "${{ github.event.inputs.stage }}" "${{ github.event.inputs.n }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stagecheck-${{ github.event.inputs.stage }}
          path: out/
