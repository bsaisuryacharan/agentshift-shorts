name: orchestrator
# Runs once per Telegram message (sent by the Cloudflare Worker). Public repo = free unlimited minutes.
on:
  repository_dispatch:
    types: [telegram]
concurrency:
  group: orchestrator            # one job at a time; GitHub keeps only the newest waiting message, so send one change at a time
  cancel-in-progress: false
permissions:
  contents: write
  actions: read              # /upload downloads the approved video from the run artifact
jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      GH_TOKEN: ${{ github.token }}
      CHAT: ${{ github.event.client_payload.chat }}
      TEXT: ${{ github.event.client_payload.text }}     # passed via env, never interpolated into the shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Light command? (no render needed)
        id: kind
        run: |
          if [[ "$TEXT" =~ ^/(status|target|list|use|approve|upload|help|start)([[:space:]]|$) ]]; then echo "light=true" >> "$GITHUB_OUTPUT"; fi
      - name: Handle (light, ~20 s)
        if: steps.kind.outputs.light == 'true'
        run: |
          pip install -q httpx python-dotenv google-api-python-client google-auth google-auth-oauthlib
          python -m app.orchestrator handle --chat "$CHAT" --text "$TEXT"
      - name: Cache Chromium
        if: steps.kind.outputs.light != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      - name: Handle (full pipeline)
        if: steps.kind.outputs.light != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji
          pip install -e . && playwright install --with-deps chromium
          python -m app.orchestrator handle --chat "$CHAT" --text "$TEXT"
      - uses: actions/upload-artifact@v4          # /new runs keep their video so /upload can fetch it later
        if: always() && steps.kind.outputs.light != 'true'
        with:
          name: run
          path: |
            runs/**/telegram.mp4
            runs/**/publish.md
      - name: Save state (also keeps the repo active)
        if: always()
        run: |
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          for f in state projects data/history.jsonl data/topics.jsonl data/features.jsonl data/scorecards.jsonl; do git add "$f" 2>/dev/null || true; done
          git commit -m "state: $(date -u +%FT%TZ)" || true
          git pull --rebase -q || true
          git push || true
