name: upload-video
# Owner-requested one-off: uploads a video attached to a GitHub release (video + description.txt) to the channel PUBLIC.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag holding the .mp4 and description.txt", required: true }
      title: { description: "Title", required: true }
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag }}
      TITLE: ${{ github.event.inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q httpx google-api-python-client google-auth google-auth-oauthlib
      - run: gh release download "$TAG" -D dl
      - run: |
          python - <<'PY'
          import glob, json, os
          from pathlib import Path
          from app.upload import upload
          video = Path(glob.glob("dl/*.mp4")[0])
          parts = {"title": os.environ["TITLE"], "description": Path("dl/description.txt").read_text(),
                   "tags": ["AI video", "how AI video works", "diffusion model", "Wan 2.1", "explainer", "machine learning", "science and technology"]}
          print(json.dumps(upload(video, parts, mode="public")))
          PY
