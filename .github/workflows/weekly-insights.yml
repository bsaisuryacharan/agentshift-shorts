name: weekly-insights
# Daily: refreshes trend signals, the idea bank's reference-channel breakouts and the owner's channel analytics and commits assets/insights.json, which the topic picker and
# script writer read. Runs in the cloud only. Optional secrets: YOUTUBE_API_KEY, YOUTUBE_TOKEN_JSON (see docs/FREE_SYSTEM.md).
on:
  schedule:
    - cron: "23 3 * * *"       # daily 03:23 UTC (08:53 IST), before the first Short slot: trends move daily
  workflow_dispatch:
concurrency: weekly-insights
permissions:
  contents: write
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      TREND_REGION: IN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -e .
      - name: Refresh insights
        run: python -m app.weekly
      - name: Growth plan for today + report to Telegram (goal: 1,000,000 channel views in a month)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.strategy || true
      - name: Commit insights
        run: |
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          git add assets/insights.json assets/idea_bank.json assets/strategy.json data/latest_trend_report.json data/latest_channel_analytics.json 2>/dev/null || true
          git commit -m "insights: $(date -u +%F)" || true
          git pull --rebase -q || true
          git push || true
