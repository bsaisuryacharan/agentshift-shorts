name: hud-test
# Renders every vendored HyperFrames gallery component inside the overlay and uploads a contact sheet. No LLM, no pictures: costs no free quota.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -y && sudo apt-get install -y fonts-noto fonts-noto-color-emoji
      - run: pip install -e . && playwright install --with-deps chromium
      - run: python -m app.hudtest out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hudtest
          path: |
            out/sheet.jpg
            out/page.html
