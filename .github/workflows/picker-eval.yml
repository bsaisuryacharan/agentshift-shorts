name: picker-eval
# Dry run of the topic picker (no video, no state written): shows candidates, channel insights and the choice, 3 times.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q httpx python-dotenv pydantic pydantic-settings
      - run: |
          for i in 1 2 3; do python -m app.auto --trend --pick-only --out /tmp/x || true; done
