name: free-daily-short
# Zero-cost autonomous Short (see docs/FREE_SYSTEM.md). Public repo = unlimited minutes. PUBLISH stays manual: the video goes to Telegram.
on:
  schedule:                    # GitHub starts scheduled runs late and sometimes drops them: three slots, and a slot is skipped once today's Short exists
    - cron: "17 4 * * *"       # 09:47 IST
    - cron: "47 8 * * *"       # 14:17 IST
    - cron: "37 12 * * *"      # 18:07 IST
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (blank = top Google Trends item)"
        required: false
concurrency: free-daily
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System deps
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji
      - name: Python deps
        run: pip install -e . && playwright install --with-deps chromium
      - name: Telegram command menu (typing / lists the commands)
        run: python -m app.botmenu || true
      - name: Make one Short
        run: |
          T="${{ github.event.inputs.topic }}"
          if [ "${{ github.event_name }}" = "schedule" ] && python -m app.auto --delivered-today; then echo "::notice::Today's Short was already delivered; this slot is skipped"; exit 0; fi
          set +e
          if [ -n "$T" ]; then python -m app.auto --topic "$T" --out runs; else python -m app.auto --trend --out runs; fi
          rc=$?
          # exit 3 = no Short passed the quality review; the best draft is kept as a run artifact only (never sent to Telegram): not a workflow failure
          if [ "$rc" -eq 3 ]; then echo "::notice::No Short passed review; best draft kept as an artifact, nothing sent to Telegram"; exit 0; fi
          exit "$rc"
      - name: Register the Short for /status /list /approve
        if: always()
        run: python -m app.orchestrator register || true
      - name: Keep the repo active (schedules pause after 60 idle days) and save the ledger
        if: always()
        run: |
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          for f in data/history.jsonl data/judge_notes.jsonl data/topics.jsonl data/features.jsonl data/scorecards.jsonl state projects; do git add "$f" 2>/dev/null || true; done
          git commit -m "ledger: $(date -u +%F)" || true
          git pull --rebase -q || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run
          path: |
            runs/**/telegram.mp4
            runs/**/publish.md
            runs/**/qa.json
            runs/**/vision.json
            runs/**/sheet.jpg
          retention-days: 7
