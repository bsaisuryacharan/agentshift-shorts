name: free-daily-short
# Zero-cost autonomous Short (see docs/FREE_SYSTEM.md). Public repo = unlimited minutes. PUBLISH stays manual: the video goes to Telegram.
on:
  schedule:
    - cron: "30 11 * * *"      # 17:00 IST
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (blank = top Google Trends item)"
        required: false
concurrency: free-daily
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System deps
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji
      - name: Python deps
        run: pip install -e . && playwright install --with-deps chromium
      - name: Telegram command menu (typing / lists the commands)
        run: python -m app.botmenu || true
      - name: Make one Short
        run: |
          T="${{ github.event.inputs.topic }}"
          set +e
          if [ -n "$T" ]; then python -m app.auto --topic "$T" --out runs; else python -m app.auto --trend --out runs; fi
          rc=$?
          # exit 3 = DRAFT delivered to Telegram (judge below the visual bar): that is a delivery, not a failure
          if [ "$rc" -eq 3 ]; then echo "::notice::DRAFT delivered to Telegram"; exit 0; fi
          exit "$rc"
      - name: Register the Short for /status /list /approve
        if: always()
        run: python -m app.orchestrator register || true
      - name: Keep the repo active (schedules pause after 60 idle days) and save the ledger
        if: always()
        run: |
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.jsonl data/topics.jsonl state projects 2>/dev/null || true
          git commit -m "ledger: $(date -u +%F)" || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run
          path: |
            runs/**/telegram.mp4
            runs/**/qa.json
            runs/**/vision.json
            runs/**/sheet.jpg
          retention-days: 7
