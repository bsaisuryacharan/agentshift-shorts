name: upload-test
# Owner-triggered check of the YouTube upload path: uploads the video of a past run as PRIVATE and unscheduled, titled with [TEST]. Delete it in YouTube Studio afterwards.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id whose video artifact to upload"
        required: true
      title:
        description: "Title"
        default: "[TEST] upload check (private, delete me)"
permissions:
  contents: read
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.inputs.run_id }}
      TITLE: ${{ github.event.inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q httpx google-api-python-client google-auth google-auth-oauthlib
      - run: python -m app.upload "$RUN_ID" "$TITLE"
