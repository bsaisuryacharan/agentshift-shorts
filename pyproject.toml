[project]
name = "shorts-factory"
version = "1.0.0"
description = "Source-backed, review-gated YouTube Shorts production system"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "Pillow>=11.0.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "edge-tts>=6.1.19",
  "youtube-transcript-api>=1.0.0",
  "google-api-python-client>=2.160.0",
  "google-auth-oauthlib>=1.2.1",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "fonttools>=4.50",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
